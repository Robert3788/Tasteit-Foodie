<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Confirmed · Tasteit</title>
<style>
  :root {
    --bg: #000000;
    --card: #1a1a1a;
    --text: #ffffff;
    --muted: #999999;
    --accent: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #ff8a5b, #ff5f6d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 10px;
  }
  p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  a.button, button.button {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 14px;
    width: 100%;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: #666666;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Your email is confirmed!</h1>
    <p>Your Tasteit account is ready. You can close this page and head back to the app to log in.</p>
    <button class="button" onclick="openApp()">Open Tasteit</button>
    <p class="hint">If the button doesn't open the app automatically, just switch back to Tasteit manually and log in with your email and password.</p>
  </div>

  <script>
    function openApp() {
      const appStoreUrl = 'https://apps.apple.com/app/id6809744136';
      const clickedAt = Date.now();

      window.location.href = 'rezeptapp://';

      setTimeout(function () {
        // Wenn die Seite nach kurzer Zeit noch sichtbar ist, wurde die App
        // vermutlich nicht geöffnet (nicht installiert) -> App Store als Fallback.
        if (document.visibilityState === 'visible' && Date.now() - clickedAt < 2500) {
          window.location.href = appStoreUrl;
        }
      }, 1500);
    }
  </script>
</body>
</html>
